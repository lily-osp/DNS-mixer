name: Build Development

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        target: [esp8266, esp32]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install mpy-cross esptool

    - name: Create build directory
      run: mkdir -p build

    - name: Build firmware
      run: |
        chmod +x build.sh
        ./build.sh ${{ matrix.target }}

    - name: Upload build artifacts
      uses: actions/upload-artifact@v3
      with:
        name: dns-mixer-${{ matrix.target }}-dev
        path: |
          build/main.mpy
          build/dns-mixer-${{ matrix.target }}-*.bin
          build/version.txt
          build/deploy.sh
