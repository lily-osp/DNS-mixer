name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      target:
        description: 'Build target (esp8266, esp32, or both)'
        required: true
        default: 'both'
        type: choice
        options:
        - both
        - esp8266
        - esp32

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        target: [esp8266, esp32]
        exclude:
          - target: ${{ github.event.inputs.target == 'esp8266' && 'esp32' || '' }}
          - target: ${{ github.event.inputs.target == 'esp32' && 'esp8266' || '' }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install mpy-cross esptool

    - name: Create build directory
      run: mkdir -p build

    - name: Build firmware
      run: |
        chmod +x build.sh
        ./build.sh ${{ matrix.target }}

    - name: Upload build artifacts
      uses: actions/upload-artifact@v3
      with:
        name: dns-mixer-${{ matrix.target }}
        path: |
          build/main.mpy
          build/dns-mixer-${{ matrix.target }}-*.bin
          build/version.txt
          build/deploy.sh

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download ESP8266 artifacts
      uses: actions/download-artifact@v3
      with:
        name: dns-mixer-esp8266
        path: release/esp8266/

    - name: Download ESP32 artifacts
      uses: actions/download-artifact@v3
      with:
        name: dns-mixer-esp32
        path: release/esp32/

    - name: Create release archives
      run: |
        cd release
        # Create ESP8266 release archive
        tar -czf dns-mixer-esp8266.tar.gz -C esp8266 .
        # Create ESP32 release archive
        tar -czf dns-mixer-esp32.tar.gz -C esp32 .

    - name: Create GitHub release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          release/dns-mixer-esp8266.tar.gz
          release/dns-mixer-esp32.tar.gz
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
